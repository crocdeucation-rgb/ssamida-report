<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쌤이다 수행평가 소재 목업</title>
<style>
:root{--bg:#f3f2ef;--fg:#1b1b1f;--muted:#6d6d74;--panel:#fff;--line:#e3e1dc;--accent:#2f6fed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:20px 16px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:17px;margin:0}
.sub{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.lab{font-size:12px;color:var(--muted);width:100%}
.preset{border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.preset.on{border-color:var(--accent);color:var(--accent)}
.vnote{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.5}
.frame{overflow:hidden;border-radius:12px;margin:0 auto;box-shadow:0 10px 36px rgba(0,0,0,.18)}
.frame .card{transform-origin:top left}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.save{background:#1b1b1f;color:#fff;border:none;border-radius:10px;padding:13px 20px;font-size:14px;font-weight:800;cursor:pointer}
.save.ghost{background:var(--panel);color:var(--fg);border:1.5px solid var(--line)}
.hint{font-size:12px;color:var(--muted)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
details img{width:100%;margin-top:8px;border:1px solid var(--line)}

/* ===== CARD ===== */
.card{width:1080px;height:1080px;position:relative;overflow:hidden;background:#101110;color:#fff;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;padding:84px 80px 0}
.card.light{background:#f4f2ec;color:#151515}
.tag{display:inline-block;background:#C9F22F;color:#101110;font-size:26px;font-weight:800;padding:10px 22px;border-radius:999px;margin-bottom:34px;letter-spacing:-.3px}
.h{font-size:80px;font-weight:900;line-height:1.18;letter-spacing:-3px;word-break:keep-all}
.h em{font-style:normal;color:#C9F22F}
.light .h em{color:#101110;background:linear-gradient(transparent 58%,#C9F22F 58%)}
.s{font-size:32px;line-height:1.45;opacity:.78;margin-top:26px;letter-spacing:-.6px;word-break:keep-all}
.foot{position:absolute;left:80px;right:80px;bottom:44px;display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-size:38px;font-weight:900;color:#C9F22F;letter-spacing:-1px}
.light .logo{color:#101110}
.logo small{display:block;font-size:20px;font-weight:600;color:#fff;opacity:.6;letter-spacing:0;margin-top:4px}
.light .logo small{color:#151515}
.cta{background:#C9F22F;color:#101110;font-size:28px;font-weight:800;padding:20px 30px;border-radius:16px}
.note{position:absolute;left:80px;right:80px;bottom:150px;font-size:19px;opacity:.45}

/* ① 비중 막대 */
.bars{margin-top:54px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;align-items:center;gap:24px}
.bar .k{width:120px;font-size:32px;font-weight:700;opacity:.7}
.bar .v{height:72px;border-radius:12px;background:#2c2e2a;display:flex;align-items:center;padding-left:24px;font-size:34px;font-weight:800}
.bar.hot .k{opacity:1;color:#C9F22F}
.bar.hot .v{background:#C9F22F;color:#101110}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;padding-left:144px}
.chip{border:2px solid #C9F22F;color:#C9F22F;border-radius:12px;padding:10px 18px;font-size:25px;font-weight:700}

/* ② 흐림→선명 */
.flip{margin-top:50px;display:flex;flex-direction:column;gap:20px}
.doc{border-radius:22px;padding:28px 34px}
.doc .l{font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.doc.before{background:#1c1e1a;color:#8b8d86;filter:blur(1.2px)}
.doc.before .t{font-size:32px}
.doc.after{background:#fff;color:#101110;box-shadow:0 0 0 4px #C9F22F}
.doc.after .l{color:#5b7d00}
.doc.after .t{font-size:52px;font-weight:900;letter-spacing:-1.5px}
.doc.after .m{font-size:24px;color:#555;margin-top:8px}
.arrow{font-size:28px;color:#C9F22F;font-weight:800;padding-left:10px}

/* ③ 형태 나열 */
.rows{margin-top:46px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:22px;align-items:center;background:#1c1e1a;border-radius:18px;padding:22px 26px}
.row .ty{flex:none;width:150px;text-align:center;background:#C9F22F;color:#101110;font-size:26px;font-weight:900;border-radius:10px;padding:10px 0}
.row .tt{font-size:31px;font-weight:700;letter-spacing:-.8px;line-height:1.3;word-break:keep-all}

/* ④ 메모 */
.memo{margin:44px auto 0;width:640px;background:#fff8c9;color:#2a2a2a;padding:40px 44px;transform:rotate(-2.5deg);box-shadow:0 22px 50px rgba(0,0,0,.25);border-radius:4px}
.memo .d{font-size:26px;color:#b04a2c;font-weight:800;margin-bottom:12px}
.memo .t{font-size:40px;font-weight:800;line-height:1.3;letter-spacing:-1px;word-break:keep-all}
.memo .w{font-size:24px;color:#666;margin-top:14px}

/* ⑤ 카톡 */
.chat{margin-top:44px;display:flex;gap:22px;align-items:flex-start}
.av{width:84px;height:84px;border-radius:30px;background:#C9F22F;color:#101110;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.nm{font-size:26px;opacity:.7;margin-bottom:10px}
.bub{background:#fff;color:#151515;border-radius:6px 30px 30px 30px;padding:30px 34px;font-size:36px;line-height:1.45;letter-spacing:-.8px;max-width:780px;word-break:keep-all}
.bub b{background:linear-gradient(transparent 60%,#C9F22F 60%)}
.tm{font-size:20px;opacity:.5;margin-top:10px}
</style><!--ssr-mobile--><meta name="robots" content="noindex,nofollow,noarchive"><style>@media(max-width:900px){html{-webkit-text-size-adjust:100%}

table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}

<script>
const CARD=1080;
const NOTE='과제 예시: 시·도교육청 지원 「고등학교 수학 수행평가 문항 자료집」 · 비중은 학교·과목별로 다름';
const FOOT=(cta)=>`<div class="note" ce>${NOTE}</div><div class="foot"><div class="logo" ce>과외는, 쌤이다<small>수행평가까지 챙기는 1:1 화상과외</small></div><div class="cta" ce>${cta}</div></div>`;
const V=[
 {k:'s1',label:'① 비중 대비',note:'중간 30 · 기말 30 · 수행 40 막대 + 수행 과제 칩. 비중은 예시(학교마다 다름).',
  html:`<div class="h" ce>중간고사보다<br><em>큰 시험</em>이 있어요.</div>
  <div class="bars">
   <div class="bar"><div class="k" ce>중간</div><div class="v" style="width:450px" ce>30%</div></div>
   <div class="bar"><div class="k" ce>기말</div><div class="v" style="width:450px" ce>30%</div></div>
   <div class="bar hot"><div class="k" ce>수행</div><div class="v" style="width:740px" ce>40% · 영어는 50%인 학교도</div></div>
  </div>
  <div class="chips"><span class="chip" ce>세금 함수 만들기</span><span class="chip" ce>나만의 수열을 그래프로</span><span class="chip" ce>사업 전략 세우기</span></div>
  ${FOOT('수행평가 상담받기 →')}`},
 {k:'s2',label:'② 1주일 반전',note:'흐린 평가계획 → 선명한 실제 과제. 제 추천.',
  html:`<div class="h" ce>비중은 40%인데,<br><em>과제는 1주일 전에야</em> 나와요.</div>
  <div class="flip">
   <div class="doc before"><div class="l" ce>학기 초 공개 · 평가계획</div><div class="t" ce>미적분Ⅰ · 함수의 연속 · 프로젝트/포트폴리오</div></div>
   <div class="arrow" ce>↓ 제출 1주일 전</div>
   <div class="doc after"><div class="l" ce>실제 과제</div><div class="t" ce>세금 함수 만들기</div><div class="m" ce>프로젝트 · 포트폴리오 · 관찰 및 기록</div></div>
  </div>
  ${FOOT('수행평가 준비 상담받기 →')}`},
 {k:'s3',label:'③ 형태 나열',note:'평가 형태 태그 × 과제명 3줄.',
  html:`<div class="h" ce>쪽지시험일지, 보고서일지, 발표일지<br><em>1주일 전까지 몰라요.</em></div>
  <div class="rows">
   <div class="row"><div class="ty" ce>구술</div><div class="tt" ce>수학사로 보는 미적분의 발전 과정</div></div>
   <div class="row"><div class="ty" ce>실험·실습</div><div class="tt" ce>스프레드시트로 방정식의 실근 위치 찾기</div></div>
   <div class="row"><div class="ty" ce>토론·토의</div><div class="tt" ce>함수 그래프와 접선의 방정식 분류하기</div></div>
  </div>
  ${FOOT('수행평가 상담받기 →')}`},
 {k:'s4',label:'④ 엄마 화자',note:'라이트 배경 + 책상 위 메모 장면.',light:1,
  html:`<div class="h" ce>중간·기말만 챙겼는데,<br>성적표 <em>40%</em>가 수행평가였어요.</div>
  <div class="memo"><div class="d" ce>수행 · 다음 주 금요일까지!</div><div class="t" ce>이항분포와 정규분포를 활용한 문제 해결하기</div><div class="w" ce>논술 + 프로젝트 + 실험·실습</div></div>
  ${FOOT('수행평가 상담받기 →')}`},
 {k:'s5',label:'⑤ 선생님 톡',note:'선생님 → 학부모 메시지. 실제로 하는 일이라 사실성 OK.',
  html:`<div class="h" ce>1주일 전 공지에도<br><em>당황하지 않게.</em></div>
  <div class="chat"><div class="av" ce>쌤</div><div><div class="nm" ce>이서연 선생님</div>
   <div class="bub" ce>어머님, 수학 수행 공지 떴대요. <b>'세금 함수 만들기'</b> 프로젝트고 다음 주 목요일 제출이에요. 이번 수업 30분은 주제 잡는 데 쓸게요.</div>
   <div class="tm" ce>오후 9:12</div></div></div>
  ${FOOT('수행평가 상담받기 →')}`}
];
let cur=0;
function render(i){cur=i;const v=V[i],c=document.getElementById('adcard');
  c.className='card'+(v.light?' light':'');
  c.innerHTML=v.html.replace(/ ce>/g,' contenteditable="true" spellcheck="false">');
  document.querySelectorAll('#vers .preset').forEach((b,j)=>b.classList.toggle('on',j===i));
  document.getElementById('vnote').textContent=v.note;fit();}
function fit(){const fr=document.querySelector('.frame'),c=document.getElementById('adcard');
  const s=Math.min(window.innerWidth*0.92,520)/CARD;c.style.transform='scale('+s+')';fr.style.width=CARD*s+'px';fr.style.height=CARD*s+'px';}
window.addEventListener('resize',fit);
V.forEach((v,i)=>{const b=document.createElement('button');b.className='preset';b.textContent=v.label;b.onclick=()=>render(i);document.getElementById('vers').appendChild(b);});
render(0);
async function toPng(){const clone=document.getElementById('adcard').cloneNode(true);clone.style.transform='none';
  const h=document.createElement('div');h.style.cssText='position:fixed;left:-100000px;top:0;width:1080px;height:1080px';
  h.appendChild(clone);document.body.appendChild(h);try{await document.fonts.ready}catch(e){}
  await new Promise(r=>setTimeout(r,80));
  const u=await htmlToImage.toPng(clone,{width:CARD,height:CARD,pixelRatio:2,cacheBust:true,skipFonts:true});h.remove();return u;}
function dl(u,n){const a=document.createElement('a');a.download=n;a.href=u;document.body.appendChild(a);a.click();a.remove();}
async function saveOne(){const m=document.getElementById('msg');m.textContent='PNG 만드는 중…';
  try{dl(await toPng(),`ssamida_suhang_${V[cur].k}.png`);m.textContent='저장 완료 (2160×2160)';}catch(e){m.textContent='저장 실패: '+(e.message||e);}}
async function saveAll(){const m=document.getElementById('msg'),keep=cur;
  for(let i=0;i<V.length;i++){render(i);m.textContent=`저장 중 ${i+1}/${V.length}…`;try{dl(await toPng(),`ssamida_suhang_${V[i].k}.png`)}catch(e){}await new Promise(r=>setTimeout(r,400));}
  render(keep);m.textContent='전체 저장 완료';}
</script></body></html>
