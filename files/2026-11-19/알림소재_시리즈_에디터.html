<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쌤이다 알림 소재 에디터 · 시리즈</title>
<style>
:root{--bg:#f3f2ef;--fg:#1b1b1f;--muted:#6d6d74;--panel:#fff;--line:#e3e1dc;--btn:#1b1b1f;--btnfg:#fff;--accent:#2f6fed;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:20px 16px;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
h1{font-size:17px;margin:0;letter-spacing:-.3px}
.sub{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:12px;color:var(--muted);width:100%}
.preset{border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.preset.on{border-color:var(--accent);color:var(--accent)}
.vnote{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.5}
.frame{overflow:hidden;border-radius:12px;margin:0 auto;box-shadow:0 10px 36px rgba(0,0,0,.18)}
.frame .card{transform-origin:top left}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.save{background:var(--btn);color:var(--btnfg);border:none;border-radius:10px;padding:13px 20px;font-size:14px;font-weight:800;cursor:pointer}
.save.ghost{background:var(--panel);color:var(--fg);border:1.5px solid var(--line)}
.hint{font-size:12px;color:var(--muted)}
[contenteditable]{cursor:text}

/* ===== CARD 1080×1080 ===== */
.card{width:1080px;height:1080px;position:relative;display:flex;flex-direction:column;align-items:center;
  padding:0 0 150px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;}
.card.nohead{justify-content:center}
.card.hashead{justify-content:flex-start}
.bg-a{background:linear-gradient(170deg,#0c1020 0%,#151a2e 55%,#1a1430 100%);color:#fff}
.bg-b{background:linear-gradient(170deg,#f6f4ee 0%,#edeae1 100%);color:#17171a}
.bg-c{background:linear-gradient(170deg,#101110 0%,#1a1c18 100%);color:#fff}
.headline{display:none;width:940px;margin-top:92px;margin-bottom:56px;text-align:center;
  font-size:78px;font-weight:900;letter-spacing:-2.6px;line-height:1.22;word-break:keep-all}
.hashead .headline{display:block}
.bg-c .headline em{color:#C9F22F}
.bg-a .headline em{color:#ffd76a}
.bg-b .headline em{color:#2f6fed}
.headline em{font-style:normal}
.lock-time{font-size:150px;font-weight:200;letter-spacing:-4px;line-height:1;margin-bottom:12px;font-variant-numeric:tabular-nums}
.lock-date{font-size:34px;opacity:.75;margin-bottom:84px;letter-spacing:-.5px}
.hashead .lock-time{font-size:96px;margin-bottom:6px}
.hashead .lock-date{font-size:26px;margin-bottom:34px}
.stack{display:flex;flex-direction:column;gap:18px;align-items:center}
.notif{width:880px;border-radius:36px;padding:36px 42px;background:rgba(255,255,255,.93);color:#111;
  box-shadow:0 18px 60px rgba(0,0,0,.35);text-align:left}
.bg-b .notif{background:#fff;box-shadow:0 16px 48px rgba(40,36,20,.18);border:1px solid #e6e2d6}
.notif.dim{opacity:.78}
.nh{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.icon{width:60px;height:60px;border-radius:15px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;flex:none}
.icon.lime{background:#101110;color:#C9F22F}
.icon.gray{background:#8c8c93}
.icon.msg{background:#3a3a40;border-radius:50%}
.app{font-size:27px;font-weight:700;color:#555;flex:1}
.nt{font-size:25px;color:#8a8a8f}
.ttl{font-size:44px;font-weight:800;letter-spacing:-1.2px;line-height:1.3;margin-bottom:10px;word-break:keep-all}
.bd{font-size:36px;color:#3a3a40;letter-spacing:-.8px;line-height:1.45;word-break:keep-all}
.hashead .notif{padding:30px 38px}
.hashead .ttl{font-size:40px}
.hashead .bd{font-size:33px}
.hashead .stack.two .ttl{font-size:34px}
.hashead .stack.two .bd{font-size:31px}
.card.tight .headline{margin-top:64px;margin-bottom:30px;font-size:70px}
.card.tight .lock-time{font-size:76px;margin-bottom:4px}
.card.tight .lock-date{margin-bottom:24px}
.card.tight .stack{gap:12px}
.card.tight .notif{padding:24px 36px}
.card.tight .nh{margin-bottom:10px}
.brandline{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:32px;font-weight:800;letter-spacing:-.5px;opacity:.95}
.brandsub{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:20px;opacity:.5}
</style><!--ssr-mobile--><meta name="robots" content="noindex,nofollow,noarchive"><style>@media(max-width:900px){html{-webkit-text-size-adjust:100%}
img,video,svg{max-width:100%;height:auto}
table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
pre,code{white-space:pre-wrap;word-break:break-all}}</style></head><body>
<div class="wrap">
  <h1>쌤이다 · 알림 소재 에디터 (시리즈)</h1>
  <p class="sub">버전 고르고 → 배경 고르고 → 카드 안 글자 눌러서 수정 → 저장. PNG는 2160×2160(메타 1:1). 버전을 바꾸면 수정한 글자는 초기화돼요.</p>

  <div class="controls" id="vers"><span class="lab">버전</span></div>
  <div class="vnote" id="vnote"></div>

  <div class="controls">
    <span class="lab">배경</span>
    <button class="preset on" data-bg="a" onclick="setBg('a')">A 심야 잠금화면</button>
    <button class="preset" data-bg="b" onclick="setBg('b')">B 종이 라이트</button>
    <button class="preset" data-bg="c" onclick="setBg('c')">C 차콜+라임</button>
  </div>

  <div class="frame"><div class="card bg-a" id="adcard"></div></div>

  <div class="actions">
    <button class="save" onclick="saveOne()">이 버전 PNG 저장</button>
    <button class="save ghost" onclick="saveAll()">전 버전 일괄 저장</button>
    <span class="hint" id="msg"></span>
  </div>
</div>

let cur=0, bg='a';

function render(i){
  cur=i; const v=V[i], c=document.getElementById('adcard');
  c.className='card bg-'+bg+' '+(v.head?'hashead':'nohead')+(v.head&&v.stack.length>1?' tight':'');
  const nf=v.stack.map(n=>`<div class="notif${n.dim?' dim':''}"><div class="nh"><div class="icon ${n.c}" ${E()}>${n.i}</div><div class="app" ${E()}>${n.app}</div><div class="nt" ${E()}>${n.nt}</div></div>${n.t?`<div class="ttl" ${E()}>${n.t}</div>`:''}<div class="bd" ${E()}>${n.b}</div></div>`).join('');

   <div class="lock-time" ${E()}>${v.time}</div><div class="lock-date" ${E()}>${DATE}</div>
   <div class="stack${v.stack.length>1?' two':''}">${nf}</div>
   <div class="brandline" ${E()}>${v.brand}</div><div class="brandsub" ${E()}>${v.sub}</div>`;
  document.querySelectorAll('#vers .preset').forEach((b,j)=>b.classList.toggle('on',j===i));

}
function setBg(k){bg=k;const c=document.getElementById('adcard');c.classList.remove('bg-a','bg-b','bg-c');c.classList.add('bg-'+k);
  document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('on',b.dataset.bg===k));}
function fit(){const fr=document.querySelector('.frame'),c=document.getElementById('adcard');

async function toBlob(){
  const src=document.getElementById('adcard'),clone=src.cloneNode(true);
  clone.style.transform='none';
  const h=document.createElement('div');
  h.style.cssText='position:fixed;left:-100000px;top:0;width:'+CARD+'px;height:'+CARD+'px;';
  h.appendChild(clone);document.body.appendChild(h);
  try{await document.fonts.ready}catch(e){}
  await new Promise(r=>setTimeout(r,80));
  const url=await htmlToImage.toPng(clone,{width:CARD,height:CARD,pixelRatio:2,cacheBust:true,skipFonts:true});
  document.body.removeChild(h);
  return url;
}
function dl(url,name){const a=document.createElement('a');a.download=name;a.href=url;document.body.appendChild(a);a.click();a.remove();}
async function saveOne(){
  const m=document.getElementById('msg');m.textContent='PNG 만드는 중…';
  try{dl(await toBlob(),`ssamida_notif_${V[cur].k}_${bg}.png`);m.textContent='저장 완료 (2160×2160)';}
  catch(e){m.textContent='저장 실패: '+(e.message||e);}
}
async function saveAll(){
  const m=document.getElementById('msg'),keep=cur;
  for(let i=0;i<V.length;i++){render(i);m.textContent=`저장 중 ${i+1}/${V.length}…`;
    try{dl(await toBlob(),`ssamida_notif_${V[i].k}_${bg}.png`)}catch(e){}
    await new Promise(r=>setTimeout(r,400));}
  render(keep);m.textContent='전체 저장 완료';
}
</script>
</body></html>
